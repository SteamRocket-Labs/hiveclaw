name: atlassian-rovo
cases:
  - name: read_jira_issue
    input: "Read Jira issue PROJ-123 using the configured Atlassian integration."
    expected_behavior:
      - verify atlassian_rovo tools are visible
      - use the exact runtime tool schema
  - name: stop_when_rovo_missing
    input: "Create a Confluence page but no atlassian_rovo tools are available."
    expected_behavior:
      - report integration not configured
      - do not scrape authenticated web UI
