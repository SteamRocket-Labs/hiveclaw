name: command_pack
version: "0.1.0"
description: "Historical CC/Codex command facade. Command tools are core runtime primitives; this pack records the dependency surface only."
source:
  kind: builtin

tools:
  - name: task_create
    role: requires_core
    governance:
      security_zone: public
  - name: task_update
    role: requires_core
    governance:
      security_zone: public
  - name: task_list
    role: requires_core
    governance:
      security_zone: public
  - name: task_get
    role: requires_core
    governance:
      security_zone: public
  - name: task_output
    role: requires_core
    governance:
      security_zone: public
  - name: task_stop
    role: requires_core
    governance:
      security_zone: restricted
  - name: goal_start
    role: requires_core
    governance:
      security_zone: public
  - name: advanced_plan
    role: requires_core
    governance:
      security_zone: restricted
  - name: verify_plan
    role: requires_core
    governance:
      security_zone: public

activation:
  default_state: inactive
