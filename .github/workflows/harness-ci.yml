name: Harness CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-harness:
    name: Backend harness gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: harness-ci-secret
      JWT_SECRET_KEY: harness-ci-jwt-secret
      SECRETS_MASTER_KEY: harness-ci-master-secret
      AGENT_DATA_DIR: /tmp/hive-agent-data
      DATABASE_URL: sqlite+aiosqlite:///tmp/hive-ci.db
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests

      - name: Pytest eval and harness suites
        run: |
          pytest tests/evals tests/runtime/test_prompt_cache.py tests/runtime/test_prompt_eval.py \
            tests/services/test_prompt_contracts.py -q

      - name: Prompt contract eval
        run: python -m app.runtime.prompt_eval --fail-severity=critical,high

      - name: Reward-hack adversarial suite
        run: python -m app.evals.adversarial_suite --output /tmp/hive-adversarial-suite.json

      - name: Internal harness eval (fail-gate G3)
        run: python -m app.evals.run --suite core_v1 --target clawith --mode internal --fail-under 90

      - name: Self-evolution behavior bakeoff (Hive absolute gate; Hermes only via real run)
        # E7: no injected/grep-marker Hermes scores. Hermes is 'unavailable' here
        # (no live hermes CLI), so the Hive absolute threshold gates.
        run: python -m app.evals.self_evolution_bakeoff
