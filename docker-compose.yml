services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: hive
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U hive" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  onlyoffice-documentserver:
    image: onlyoffice/documentserver:9.3
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-change-me-onlyoffice-secret}
    ports:
      - "${ONLYOFFICE_PORT:-8082}:80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice

  backend:
    build:
      context: ./backend
      args:
        CLAWITH_PIP_INDEX_URL: ${CLAWITH_PIP_INDEX_URL:-}
        CLAWITH_PIP_TRUSTED_HOST: ${CLAWITH_PIP_TRUSTED_HOST:-}
        OFFICECLI_DOWNLOAD_URL: ${OFFICECLI_DOWNLOAD_URL:-}
        OFFICECLI_SHA256: ${OFFICECLI_SHA256:-}
    restart: unless-stopped
    command: ["/bin/bash", "/app/entrypoint.sh"]
    environment:
      DATABASE_URL: postgresql+asyncpg://hive:hive@postgres:5432/hive
      REDIS_URL: redis://redis:6379/0
      AGENT_DATA_DIR: /data/agents
      AGENT_TEMPLATE_DIR: /app/agent_template
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-jwt-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173"]}  # Set explicit origins in production!
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      DOCKER_NETWORK: hive_network
      # GitHub personal access token — fallback for ClawHub/GitHub skill imports
      # when no tenant-level token is configured. Raises API rate limit from 60 to 5,000/hr.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SS_CONFIG_FILE: /data/ss-nodes.json
      OFFICECLI_BIN: ${OFFICECLI_BIN:-officecli}
      OFFICECLI_SHA256: ${OFFICECLI_SHA256:-}
      OFFICECLI_TIMEOUT_SECONDS: ${OFFICECLI_TIMEOUT_SECONDS:-45}
      OFFICECLI_SKIP_UPDATE: "1"
      ONLYOFFICE_DOCS_URL: ${ONLYOFFICE_DOCS_URL:-http://localhost:8082}
      ONLYOFFICE_INTERNAL_DOCS_URL: ${ONLYOFFICE_INTERNAL_DOCS_URL:-http://onlyoffice-documentserver}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-change-me-onlyoffice-secret}
      ONLYOFFICE_DOWNLOAD_TOKEN_EXPIRE_SECONDS: ${ONLYOFFICE_DOWNLOAD_TOKEN_EXPIRE_SECONDS:-300}
    volumes:
      - ./backend:/app
      - ./backend/agent_data:/data/agents
      - /var/run/docker.sock:/var/run/docker.sock
      - ./ss-nodes.json:/data/ss-nodes.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3008}:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  onlyoffice_data:
  onlyoffice_logs:


networks:
  default:
    name: hive_network
