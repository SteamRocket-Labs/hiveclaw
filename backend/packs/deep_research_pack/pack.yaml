name: deep_research_pack
version: "0.1.0"
description: |
  Source-attributed deep research workflows with planning, collection,
  citation compilation, contradiction checks, and report assembly.
license: Proprietary
author: Hive Research Team

tools:
  - name: web_search
    locale: cloud
    governance:
      security_zone: public
  - name: web_fetch
    locale: cloud
    governance:
      security_zone: public
  - name: firecrawl_fetch
    locale: cloud
    governance:
      security_zone: public
      credential_scope: tenant
  - name: xcrawl_scrape
    locale: cloud
    governance:
      security_zone: public
      credential_scope: tenant
  - name: read_file
    locale: cloud
    governance:
      security_zone: public
  - name: write_file
    locale: cloud
    governance:
      security_zone: restricted
      approval_required: false
  - name: edit_file
    locale: cloud
    governance:
      security_zone: restricted
      approval_required: false
  - name: list_files
    locale: cloud
    governance:
      security_zone: public
  - name: grep_search
    locale: cloud
    governance:
      security_zone: public
  - name: glob_search
    locale: cloud
    governance:
      security_zone: public
  - name: delegate_to_agent
    locale: cloud
    governance:
      security_zone: restricted
      approval_required: false
  - name: send_channel_file
    locale: cloud
    governance:
      security_zone: restricted
      credential_scope: tenant

skills:
  - skills/topic-deep-dive
  - skills/industry-research
  - skills/source-ledger-audit

data_sources:
  public_default:
    - web_search
    - web_fetch
    - duckduckgo_fallback
  paid_optional:
    - tavily
    - exa
    - firecrawl
    - xcrawl

mcp_servers: []

credential_requirements:
  - key: tavily_api_key
    scope: tenant
    storage: encrypted_tool_config
    used_by:
      - web_search
  - key: exa_api_key
    scope: tenant
    storage: encrypted_tool_config
    used_by:
      - web_search
  - key: firecrawl_api_key
    scope: tenant
    storage: encrypted_tool_config
    used_by:
      - firecrawl_fetch
  - key: xcrawl_api_key
    scope: tenant
    storage: encrypted_tool_config
    used_by:
      - xcrawl_scrape

activation:
  required_capabilities:
    - web_research
  default_state: inactive

sandbox_requirements:
  pip_packages: []
