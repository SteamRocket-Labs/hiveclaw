name: web_pack
version: "0.1.0"
description: No-key-first advanced web search and provider-backed page extraction.
source:
  kind: builtin

tools:
  - name: web_search
    role: requires_core
    governance:
      security_zone: public
  - name: advanced_web_search
    role: optional_provider
    governance:
      security_zone: public
  - name: advanced_web_fetch
    role: optional_provider
    governance:
      security_zone: public
  - name: anysearch_get_sub_domains
    role: optional_provider
    governance:
      security_zone: public
  - name: anysearch_search
    role: optional_provider
    governance:
      security_zone: public
  - name: anysearch_batch_search
    role: optional_provider
    governance:
      security_zone: public
  - name: anysearch_extract
    role: optional_provider
    governance:
      security_zone: public
  - name: exa_search
    role: optional_provider
    governance:
      security_zone: public
  - name: exa_fetch
    role: optional_provider
    governance:
      security_zone: public
  - name: tavily_search
    role: optional_provider
    governance:
      security_zone: public
  - name: tavily_extract
    role: optional_provider
    governance:
      security_zone: public
  - name: firecrawl_search
    role: optional_provider
    governance:
      security_zone: public
  - name: firecrawl_fetch
    role: optional_provider
    governance:
      security_zone: public
  - name: xcrawl_scrape
    role: optional_provider
    governance:
      security_zone: public

credential_requirements:
  - key: anysearch_api_keys
    scope: tenant
    storage: encrypted_tool_config
    used_by:
      - anysearch_get_sub_domains
      - anysearch_search
      - anysearch_batch_search
      - anysearch_extract
      - advanced_web_search
      - advanced_web_fetch
  - key: exa_api_key
    scope: tenant
    storage: encrypted_tool_config
    used_by:
      - exa_search
      - exa_fetch
      - advanced_web_search
      - advanced_web_fetch
  - key: tavily_api_key
    scope: tenant
    storage: encrypted_tool_config
    used_by:
      - tavily_search
      - tavily_extract
      - advanced_web_search
      - advanced_web_fetch
  - key: firecrawl_api_key
    scope: tenant
    storage: encrypted_tool_config
    used_by:
      - firecrawl_search
      - firecrawl_fetch
      - advanced_web_search
      - advanced_web_fetch
  - key: xcrawl_api_key
    scope: tenant
    storage: encrypted_tool_config
    used_by:
      - xcrawl_scrape
      - advanced_web_fetch

activation:
  default_state: active
