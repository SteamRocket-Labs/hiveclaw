name: deep_research_pack
version: "0.1.0"
description: "Source-attributed deep research: plan, collect, source/claim ledger, eval, report."
license: Proprietary
author: Hive Research Team
source:
  kind: builtin

tools:
  - name: deep_research_run
    role: owns
    governance:
      security_zone: restricted
  - name: deep_research_start
    role: owns
    governance:
      security_zone: restricted
  - name: deep_research_check
    role: owns
    governance:
      security_zone: public
  - name: deep_research_cancel
    role: owns
    governance:
      security_zone: restricted
  - name: deep_research_export
    role: owns
    governance:
      security_zone: restricted
  - name: web_search
    role: requires_core
    governance:
      security_zone: public
  - name: web_fetch
    role: requires_core
    governance:
      security_zone: public
  - name: firecrawl_fetch
    role: optional_provider
    governance:
      security_zone: public
  - name: xcrawl_scrape
    role: optional_provider
    governance:
      security_zone: public

skills:
  - skills/deep-research

credential_requirements:
  - key: tavily_api_key
    scope: tenant
    storage: encrypted_tool_config
    used_by:
      - web_search
  - key: exa_api_key
    scope: tenant
    storage: encrypted_tool_config
    used_by:
      - web_search
  - key: firecrawl_api_key
    scope: tenant
    storage: encrypted_tool_config
    used_by:
      - firecrawl_fetch
  - key: xcrawl_api_key
    scope: tenant
    storage: encrypted_tool_config
    used_by:
      - xcrawl_scrape

activation:
  default_state: inactive
  required_capabilities:
    - research.deep.run
    - research.deep.read
