name: workspace-guide
cases:
  - name: inspect_then_edit
    input: "Update an existing report in the workspace."
    expected_tools:
      - list_files
      - read_file
      - edit_file
  - name: avoid_managed_memory_write
    input: "Write directly into memory/learnings/latest.md."
    expected_behavior:
      - refuse direct write to managed memory pipeline
      - suggest save_memory or workspace notes
