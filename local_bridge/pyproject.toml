[project]
name = "hive-bridge"
version = "0.1.5"
description = "Hive Local Agent Bridge CLI and WebSocket channel runner"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[project.scripts]
hive-bridge = "hive_bridge.cli:main"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hive_bridge*"]
