name: office_pack
version: "0.1.0"
description: "Office productivity: documents, spreadsheets, presentations, PDF, reports."
license: Proprietary
author: Hive Office Team
source:
  kind: builtin

tools:
  - name: read_document
    role: requires_core
    governance:
      security_zone: public
  - name: office_document_create
    role: requires_core
    governance:
      security_zone: restricted
  - name: office_document_view
    role: requires_core
    governance:
      security_zone: public
  - name: office_document_query
    role: requires_core
    governance:
      security_zone: public
  - name: office_document_apply
    role: requires_core
    governance:
      security_zone: restricted
  - name: office_document_validate
    role: requires_core
    governance:
      security_zone: public
  - name: office_document_dump
    role: requires_core
    governance:
      security_zone: public
  - name: read_file
    role: requires_core
    governance:
      security_zone: public
  - name: list_files
    role: requires_core
    governance:
      security_zone: public
  - name: write_file
    role: requires_core
    governance:
      security_zone: restricted
  - name: edit_file
    role: requires_core
    governance:
      security_zone: restricted
  - name: send_channel_file
    role: requires_core
    governance:
      security_zone: restricted

skills:
  - skills/office-productivity

activation:
  default_state: inactive
  required_capabilities:
    - office_productivity

sandbox_requirements:
  binaries:
    - officecli
  env:
    - OFFICECLI_SKIP_UPDATE=1
