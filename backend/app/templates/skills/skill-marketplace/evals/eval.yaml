name: skill-marketplace
cases:
  - name: discover_and_vet_skill_candidates
    input: Find a safe skill for invoice parsing and recommend one.
    expected_tools:
      - web_search
      - web_fetch
    expected_artifacts:
      - candidate source URL
      - risk rating
      - install confirmation request
  - name: review_provided_skill_url
    input: Review this public skill URL before installation.
    expected_tools:
      - web_fetch
    expected_artifacts:
      - required tools
      - blocking risks
      - recommendation
