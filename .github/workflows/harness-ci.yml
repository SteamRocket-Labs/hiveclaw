name: Harness CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # E8 nightly behavior gate: full suite + Hermes cross + variance + rubric.
    - cron: "0 7 * * *"

jobs:
  backend-harness:
    name: Backend harness gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: harness-ci-secret
      JWT_SECRET_KEY: harness-ci-jwt-secret
      SECRETS_MASTER_KEY: harness-ci-master-secret
      AGENT_DATA_DIR: /tmp/hive-agent-data
      DATABASE_URL: sqlite+aiosqlite:///tmp/hive-ci.db
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests

      - name: Pytest eval and harness suites
        run: |
          pytest tests/evals tests/runtime/test_prompt_cache.py tests/runtime/test_prompt_eval.py \
            tests/services/test_prompt_contracts.py -q

      - name: Memory retrieval and retirement eval
        run: python -m app.memory.retrieval_eval --data-root /tmp/hive-memory-eval

      - name: Prompt contract eval
        run: python -m app.runtime.prompt_eval --fail-severity=critical,high

      - name: Internal harness eval (fail-gate G3)
        run: python -m app.evals.run --suite core_v1 --target clawith --mode internal --fail-under 90

      - name: Self-evolution behavior bakeoff (Hive absolute gate; Hermes only via real run)
        # E7: no injected/grep-marker Hermes scores. Hermes is 'unavailable' here
        # (no live hermes CLI), so the Hive absolute threshold gates. The real
        # Hive-vs-Hermes cross-comparison runs in the nightly job below.
        run: python -m app.evals.self_evolution_bakeoff

  behavior-eval-nightly:
    name: Nightly behavior eval gate
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: harness-ci-secret
      JWT_SECRET_KEY: harness-ci-jwt-secret
      SECRETS_MASTER_KEY: harness-ci-master-secret
      AGENT_DATA_DIR: /tmp/hive-agent-data
      DATABASE_URL: sqlite+aiosqlite:///tmp/hive-ci.db
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Checkout protected evaluator trust root
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: protected-base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Full eval suite regression
        run: pytest tests/evals -q
      - name: Behavior eval gate (live; runs when eval secrets configured)
        # E8: run the Hive agent-core live runner inside the Railway eval backend
        # service, not in the GitHub runner. This exercises the deployed backend
        # image + eval Postgres/Redis + eval tenant/agent runtime. GitHub only
        # retrieves the JSON report and applies the baseline/integrity gate.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_EVAL_PROJECT_ID: ${{ secrets.RAILWAY_EVAL_PROJECT_ID }}
          RAILWAY_EVAL_ENVIRONMENT: ${{ secrets.RAILWAY_EVAL_ENVIRONMENT }}
          RAILWAY_EVAL_SERVICE: ${{ secrets.RAILWAY_EVAL_SERVICE }}
          HIVE_EVAL_REPORT: /tmp/hive-behavior-report.json
          HIVE_EVAL_INTEGRITY: /tmp/hive-evaluator-integrity.json
          HIVE_EVAL_MODEL: ${{ vars.HIVE_EVAL_MODEL }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_EVAL_PROJECT_ID" ] || [ -z "$RAILWAY_EVAL_ENVIRONMENT" ] || [ -z "$RAILWAY_EVAL_SERVICE" ]; then
            echo "::warning::behavior eval gate skipped — Railway eval service secrets not configured"
            exit 0
          fi
          curl -fsSL https://railway.app/install.sh | sh
          export PATH="$HOME/.railway/bin:$PATH"
          python -m app.evals.evaluator_integrity \
            --current-root . \
            --trusted-root ../protected-base/backend \
            --output "$HIVE_EVAL_INTEGRITY"
          REMOTE_OUTPUT="$(railway ssh \
            --project "$RAILWAY_EVAL_PROJECT_ID" \
            --environment "$RAILWAY_EVAL_ENVIRONMENT" \
            --service "$RAILWAY_EVAL_SERVICE" \
            "cd /app && python -m app.evals.hive_live_runner --production-runtime --output - --model ${HIVE_EVAL_MODEL:-claude-opus-4-8}")"
          printf '%s\n' "$REMOTE_OUTPUT"
          REPORT_B64="$(printf '%s\n' "$REMOTE_OUTPUT" | sed -n 's/^::hive-behavior-report:://p' | tail -n 1)"
          if [ -z "$REPORT_B64" ]; then
            echo "::error::Railway eval did not emit ::hive-behavior-report:: marker"
            exit 1
          fi
          python - "$REPORT_B64" "$HIVE_EVAL_REPORT" <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path

          payload = json.loads(base64.b64decode(sys.argv[1]).decode("utf-8"))
          Path(sys.argv[2]).write_text(json.dumps(payload, indent=2, ensure_ascii=False), encoding="utf-8")
          PY
          python -m app.evals.ci_gate \
            --behavior-report "$HIVE_EVAL_REPORT" \
            --baseline app/evals/baselines/core_behavior_v1.json \
            --running-model "${HIVE_EVAL_MODEL:-claude-opus-4-8}" \
            --integrity-report "$HIVE_EVAL_INTEGRITY"
