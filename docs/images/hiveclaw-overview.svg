<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">Working with an AI employee in HiveClaw</title>
  <desc id="desc">A person gives work to an AI employee. The employee uses memory, tools and knowledge, and a workspace within the organization's permissions and approvals. This is a concept diagram, not a product screenshot.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#528c82"/>
    </marker>
  </defs>
  <rect width="1120" height="420" rx="24" fill="#f5f7f4"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="48" y="51" font-size="14" font-weight="700" letter-spacing="2" fill="#42665e">HIVECLAW / HOW WORK CONNECTS</text>
    <text x="48" y="91" font-size="28" font-weight="650" fill="#172e28">A lasting employee. A shared place to work.</text>
    <rect x="48" y="150" width="210" height="126" rx="16" fill="#fff" stroke="#d1ddd5"/>
    <text x="72" y="185" font-size="13" font-weight="600" fill="#677c74">YOU &amp; YOUR TEAM</text>
    <text x="72" y="218" font-size="22" font-weight="650" fill="#172e28">The work</text>
    <text x="72" y="249" font-size="15" fill="#536b62">Ask · review · continue</text>
    <path d="M270 213 H330" stroke="#528c82" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="345" y="150" width="255" height="126" rx="16" fill="#176b5d"/>
    <text x="369" y="185" font-size="13" font-weight="600" fill="#c7e9d9">YOUR AI EMPLOYEE</text>
    <text x="369" y="218" font-size="22" font-weight="650" fill="#fff">A role that stays</text>
    <text x="369" y="249" font-size="15" fill="#e4f2eb">Identity · model · sessions</text>
    <path d="M612 213 H663 M663 158 V268 M663 158 H701 M663 213 H701 M663 268 H701" fill="none" stroke="#528c82" stroke-width="2"/>
    <rect x="714" y="136" width="358" height="45" rx="10" fill="#fff" stroke="#d1ddd5"/>
    <rect x="714" y="191" width="358" height="45" rx="10" fill="#fff" stroke="#d1ddd5"/>
    <rect x="714" y="246" width="358" height="45" rx="10" fill="#fff" stroke="#d1ddd5"/>
    <text x="735" y="165" font-size="16" fill="#24463b">Memory to carry work forward</text>
    <text x="735" y="220" font-size="16" fill="#24463b">Tools &amp; knowledge you authorize</text>
    <text x="735" y="275" font-size="16" fill="#24463b">A workspace for files &amp; results</text>
    <rect x="48" y="325" width="1024" height="51" rx="12" fill="#e4ece6"/>
    <text x="72" y="357" font-size="15" font-weight="600" fill="#395c4d">YOUR ORGANIZATION</text>
    <text x="329" y="357" font-size="15" fill="#395c4d">People &amp; roles</text>
    <text x="523" y="357" font-size="15" fill="#395c4d">Permissions &amp; approvals</text>
    <text x="803" y="357" font-size="15" fill="#395c4d">Records of what happened</text>
  </g>
</svg>
