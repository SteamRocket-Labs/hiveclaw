name: create_employee
cases:
  - name: builtin_first_blueprint
    input: "Hire a digital employee that prepares daily AI funding briefs."
    expected_tools:
      - preview_agent_blueprint
    expected_behavior:
      - prefer builtin capabilities before marketplace or MCP installs
      - seed a first objective and wake policy when recurring work is requested
  - name: platform_skill_when_mandatory
    input: "Create an employee that must pull sales data from Feishu Base every week."
    expected_tools:
      - preview_agent_blueprint
      - create_digital_employee
    expected_behavior:
      - include the mandatory Feishu skill in the blueprint
      - create only after explicit confirmation
