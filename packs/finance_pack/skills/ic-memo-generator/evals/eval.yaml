name: ic-memo-generator
cases:
- name: generate_ic_memo_from_workflow
  input: Generate an investment committee memo for a public-company research workflow.
  expected_tools:
  - finance_run_workflow
  - finance_compile_research_packet
  - finance_get_source_ledger
  expected_artifacts:
  - ic-memo.md
- name: handles_missing_or_unsafe_inputs
  input: Run ic-memo-generator with incomplete inputs or unavailable provider configuration.
  expected_behavior:
  - state the missing inputs or configuration blocker
  - do not fabricate unsupported content
