name: deep-research
cases:
  - name: topic_research_uses_sources
    input: "Research this product category and cite sources."
    expected_tools:
      - web_search
      - web_fetch
    expected_artifacts:
      - source ledger
      - contradictions and gaps
  - name: audit_existing_draft
    input: "Audit this draft against its source ledger."
    expected_tools:
      - read_file
      - web_fetch
    expected_artifacts:
      - unsupported claims
      - stale source warnings
