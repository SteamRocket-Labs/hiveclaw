name: deep_research_pack
version: "0.1.0"
description: |
  First-class source-attributed deep research workflows with dedicated
  planning, collection, source ledger, claim ledger, evaluation, and report tools.
license: Proprietary
author: Hive Research Team

tools:
  - name: deep_research_run
    locale: cloud
    governance:
      security_zone: restricted
      approval_required: false
  - name: deep_research_start
    locale: cloud
    governance:
      security_zone: restricted
      approval_required: false
  - name: deep_research_check
    locale: cloud
    governance:
      security_zone: public
  - name: deep_research_cancel
    locale: cloud
    governance:
      security_zone: restricted
      approval_required: false
  - name: deep_research_export
    locale: cloud
    governance:
      security_zone: restricted
      approval_required: false
  - name: web_search
    locale: cloud
    governance:
      security_zone: public
  - name: web_fetch
    locale: cloud
    governance:
      security_zone: public
  - name: firecrawl_fetch
    locale: cloud
    governance:
      security_zone: public
      credential_scope: tenant
  - name: xcrawl_scrape
    locale: cloud
    governance:
      security_zone: public
      credential_scope: tenant
skills:
  - skills/deep-research

data_sources:
  public_default:
    - web_search
    - web_fetch
    - duckduckgo_fallback
  paid_optional:
    - tavily
    - exa
    - firecrawl
    - xcrawl

mcp_servers: []

credential_requirements:
  - key: tavily_api_key
    scope: tenant
    storage: encrypted_tool_config
    used_by:
      - web_search
  - key: exa_api_key
    scope: tenant
    storage: encrypted_tool_config
    used_by:
      - web_search
  - key: firecrawl_api_key
    scope: tenant
    storage: encrypted_tool_config
    used_by:
      - firecrawl_fetch
  - key: xcrawl_api_key
    scope: tenant
    storage: encrypted_tool_config
    used_by:
      - xcrawl_scrape

activation:
  required_capabilities:
    - research.deep.run
    - research.deep.read
  default_state: inactive

sandbox_requirements:
  pip_packages: []
