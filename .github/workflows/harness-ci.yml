name: Harness CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  frontend-visual:
    name: Frontend unit, visual, and accessibility gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: I18n inventory and catalog gate
        run: npm run i18n:check

      - name: Frontend unit and contract tests
        run: npm test -- --run

      - name: Frontend production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright browser, visual, and accessibility gates
        run: npm run test:e2e

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  backend-harness:
    name: Backend harness gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: harness-ci-secret
      JWT_SECRET_KEY: harness-ci-jwt-secret
      SECRETS_MASTER_KEY: harness-ci-master-secret
      # Unit tests must inject DB/session dependencies. Real PostgreSQL tests
      # use Testcontainers and override this URL explicitly.
      DATABASE_URL: postgresql+asyncpg://hive:hive@127.0.0.1:1/hive_ci_no_db
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/uv.lock

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv==0.9.21"
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python scripts/patch_lark_oapi.py

      - name: Install Linux sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-profiles bubblewrap
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --version
          .venv/bin/python -c 'from app.services.subprocess_sandbox import probe_os_sandbox_capability; probe = probe_os_sandbox_capability(); assert probe.available, probe.reason; print(f"{probe.provider}: {probe.reason}")'

      - name: Ruff changed Python paths
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if ! git -C .. cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git -C .. rev-parse HEAD^ 2>/dev/null || git -C .. hash-object -t tree /dev/null)"
          fi
          mapfile -d '' python_files < <(
            git -C .. diff --name-only -z --diff-filter=ACMR \
              "$base" "$GITHUB_SHA" -- ':(glob)backend/**/*.py'
          )
          if (( ${#python_files[@]} == 0 )); then
            exit 0
          fi
          for index in "${!python_files[@]}"; do
            python_files[$index]="${python_files[$index]#backend/}"
          done
          ruff check "${python_files[@]}"
          ruff format --check "${python_files[@]}"

      - name: Legacy-brand working-tree and committed-archive gate
        run: |
          python scripts/legacy_brand_release_gate.py working-tree
          python scripts/legacy_brand_release_gate.py git-archive HEAD

      - name: Pytest full hermetic suite
        run: pytest tests -q

      - name: Prompt contract eval
        run: python -m app.runtime.prompt_eval --fail-severity=critical,high

      - name: Reward-hack adversarial suite
        run: python -m app.evals.adversarial_suite --output /tmp/hive-adversarial-suite.json

      - name: Internal harness eval (fail-gate G3)
        run: python -m app.evals.run --suite core_v1 --target hive --mode internal --fail-under 90

  atomic-user-journeys:
    name: Fifteen real API, worker, and browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # PostgreSQL baseline: postgres:15 with the pgvector extension required by Hive.
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: hive
          POSTGRES_PASSWORD: hive
          POSTGRES_DB: hive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hive -d hive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      DATABASE_URL: postgresql+asyncpg://hive:hive@127.0.0.1:5432/hive
      REDIS_URL: redis://127.0.0.1:6379/15
      SECRET_KEY: atomic-harness-secret
      JWT_SECRET_KEY: atomic-harness-jwt-secret
      SECRETS_MASTER_KEY: atomic-harness-master-secret-32bytes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install "uv==0.9.21"
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python scripts/patch_lark_oapi.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run atomic full-stack journeys
        working-directory: frontend
        run: npm run test:e2e:journeys

      - name: Upload atomic journey mechanical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atomic-journey-mechanical-evidence
          path: |
            frontend/playwright-journey-report
            frontend/test-results
          if-no-files-found: ignore
